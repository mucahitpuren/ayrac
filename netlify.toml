[build]
  # Build, then fail the deploy if the output contains a secret key (T-01-07-02).
  command = "npm run build && node scripts/check-secrets.mjs dist"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # These two values are public by design: the URL and the anon/publishable key are inlined into the
  # browser bundle and only work through row-level security. Netlify's own scanner would flag them on every
  # build, so they are omitted from it. Secret keys are still blocked by scripts/check-secrets.mjs above.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# Client-side routes (e.g. /kitap/<id>) must return the SPA on a direct load or refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # The Supabase session lives in localStorage, so a CSP is the defence-in-depth layer against injected script.
    # script-src allows only same-origin files plus the pre-paint boot script inline in index.html, pinned by its
    # sha256. EDITING THAT INLINE SCRIPT CHANGES THE HASH: update the sha256 below (tests/unit/csp.test.ts
    # recomputes it and fails on a mismatch). style-src needs 'unsafe-inline' for the style attributes and the
    # <style> element that Radix and sonner emit at runtime. Fonts are bundled, so font-src stays on the origin.
    # img-src allows any https host so remote covers (Open Library, Google Books) work without a header change.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-ngb8aZ0eeqBdxhDlSPC4PRtWOVG3t5y+J6LdnO21tH8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
